<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .stat-card-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-card-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .container-running {
            border-left: 4px solid #22c55e;
        }

        .container-stopped {
            border-left: 4px solid #ef4444;
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-server text-blue-400 text-2xl"></i>
                    <h1 class="text-2xl font-bold text-white">GoPulse</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="ws-status" class="flex items-center space-x-2">
                        <span class="h-2 w-2 rounded-full bg-gray-500" id="ws-indicator"></span>
                        <span class="text-sm text-gray-400">Connecting...</span>
                    </div>
                    {{if .ServerID}}
                    <button onclick="App.System.showPowerModal()"
                        class="text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-power-off"></i>
                    </button>
                    {{end}}
                </div>
            </div>
        </div>
    </nav>

    {{template "content" .}}

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-4 right-4 bg-gray-800 border border-gray-700 rounded-lg shadow-lg p-4 transform translate-y-32 transition-transform duration-300 hidden z-50">
        <div class="flex items-center space-x-3">
            <i id="toast-icon" class="fas fa-info-circle text-blue-500"></i>
            <p id="toast-message" class="text-white"></p>
        </div>
    </div>


    <!-- Power Modal -->
    <div id="power-modal"
        class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div
            class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-md border border-gray-700 transform scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between p-4 border-b border-gray-700 bg-gray-900 bg-opacity-50">
                <h3 class="text-xl font-bold text-white flex items-center">
                    <i class="fas fa-power-off text-red-500 mr-3"></i>
                    Power Menu
                </h3>
                <button onclick="App.System.closePowerModal()" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <p class="text-gray-300 mb-4">Select an action to perform on the server.</p>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="App.System.restart()"
                        class="flex flex-col items-center justify-center p-4 bg-gray-700 hover:bg-yellow-600/20 hover:border-yellow-500 border border-transparent rounded-lg transition-all group">
                        <i
                            class="fas fa-sync-alt text-3xl text-yellow-500 mb-2 group-hover:scale-110 transition-transform"></i>
                        <span class="font-bold text-white">Restart</span>
                    </button>

                    <button onclick="App.System.shutdown()"
                        class="flex flex-col items-center justify-center p-4 bg-gray-700 hover:bg-red-600/20 hover:border-red-500 border border-transparent rounded-lg transition-all group">
                        <i
                            class="fas fa-power-off text-3xl text-red-500 mb-2 group-hover:scale-110 transition-transform"></i>
                        <span class="font-bold text-white">Shutdown</span>
                    </button>
                </div>

                <div id="shutdown-warning"
                    class="hidden mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded text-sm text-red-200">
                    <i class="fas fa-exclamation-triangle mr-1"></i>
                    <strong>Warning:</strong> If you shut down, you will NOT be able to start the server again from this
                    UI. You will need to access the terminal manually.
                    <div class="mt-3 flex justify-end">
                        <button onclick="App.System.confirmShutdown()"
                            class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded font-bold text-xs uppercase tracking-wider">
                            Confirm Shutdown
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/app/core.js"></script>
    <script src="/static/js/app/system.js"></script>
    <script src="/static/js/app/processes.js"></script>
    <script src="/static/js/app/docker.js"></script>
    <script src="/static/js/app/containers.js"></script>
    <script src="/static/js/app/images.js"></script>
    <script src="/static/js/app/volumes.js"></script>
    <script src="/static/js/app/networks.js"></script>
    <script src="/static/js/app/files.js"></script>
    <script src="/static/js/app/projects.js?v=2"></script>
    <script src="/static/js/app/domains.js"></script>
    <script src="/static/js/app/editor.js"></script>
    <script src="/static/js/app/main.js"></script>
</body>

</html>
