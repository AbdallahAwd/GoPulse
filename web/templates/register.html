{{define "content"}}
<div class="min-h-screen flex items-center justify-center bg-radial-gradient from-gray-900 via-gray-950 to-black px-4 relative overflow-hidden">
    <!-- Animated background glowing circles -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md bg-gray-800/40 backdrop-blur-xl border border-gray-700/50 rounded-2xl shadow-2xl p-8 space-y-6 relative z-10 hover:shadow-emerald-500/5 transition-all duration-300">
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-emerald-600/10 text-emerald-400 rounded-xl border border-emerald-500/20 mb-2">
                <i class="fas fa-shield-alt text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Create Admin Account</h2>
            <p class="text-sm text-gray-400">Initialize your secure GoPulse dashboard installation</p>
        </div>

        <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
            <div class="space-y-1.5">
                <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="username" required class="w-full bg-gray-900/60 border border-gray-700/60 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 transition-all placeholder-gray-600" placeholder="Create username">
                </div>
            </div>

            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" required class="w-full bg-gray-900/60 border border-gray-700/60 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 transition-all placeholder-gray-600" placeholder="Create strong password">
                </div>
            </div>

            <div id="error-message" class="hidden p-3 bg-red-950/20 border border-red-500/30 rounded-xl text-xs text-red-400 font-medium"></div>

            <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl font-semibold shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/25 transition-all flex items-center justify-center space-x-2">
                <span>Setup Installation</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>
    </div>
</div>

<script>
async function handleRegister(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');

    errorEl.classList.add('hidden');
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Setting Up...';

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
            throw new Error(await response.text() || 'Account registration failed');
        }

        const data = await response.json();
        if (data.success) {
            // Save token in localStorage just in case (Bearer token backward compatibility)
            localStorage.setItem('jwt_token', data.token);
            
            // Redirect to home dashboard
            window.location.href = '/';
        } else {
            throw new Error(data.error || 'Registration failed');
        }
    } catch (err) {
        errorEl.textContent = err.message || 'Connection error. Please try again.';
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Setup Installation</span><i class="fas fa-arrow-right text-xs"></i>';
    }
}
</script>
{{end}}
