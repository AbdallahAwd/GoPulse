name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: go mod download && go mod verify
      - run: make check
      - run: make test-race
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make security

  secrets:
    name: Source and full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-tooling
      - run: make secrets

  # Preserve the original check name for repositories that require "security".
  security:
    needs: [vulnerabilities, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both security checks
        env:
          VULNERABILITIES: ${{ needs.vulnerabilities.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$VULNERABILITIES" = success && test "$SECRETS" = success

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag gopulse:ci .
      - name: Reject startup without a JWT secret
        run: |
          if docker run --rm gopulse:ci; then
            echo 'Unconfigured container unexpectedly started'
            exit 1
          fi

      - name: Verify configured container serves the dashboard
        run: |
          set -euo pipefail
          docker run -d --name gopulse-smoke -p 127.0.0.1:18080:8080 \
            -e GOPULSE_AUTH_JWT_SECRET="$(openssl rand -hex 32)" gopulse:ci
          trap 'docker rm -f gopulse-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/auth/has-users > /tmp/gopulse-startup.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { docker logs gopulse-smoke; exit 1; }
          jq -e '.has_users == false' /tmp/gopulse-startup.json

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build development release archive
        run: make package VERSION=dev ARCH=${{ matrix.arch }}
      - name: Verify archive checksum and native startup
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "gopulse_dev_linux_${ARCH}.tar.gz.sha256")
          if [ "$ARCH" = amd64 ]; then
            tar -xzf "dist/gopulse_dev_linux_${ARCH}.tar.gz" -C dist
            bash scripts/smoke-binary.sh "dist/gopulse_dev_linux_${ARCH}/gopulse" dev
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gopulse-linux-${{ matrix.arch }}
          path: |
            dist/gopulse_dev_linux_${{ matrix.arch }}.tar.gz
            dist/gopulse_dev_linux_${{ matrix.arch }}.tar.gz.sha256
          retention-days: 14
