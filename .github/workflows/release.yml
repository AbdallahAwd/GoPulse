name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0-alpha.1 (creates a draft)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and target
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: go mod download && go mod verify
      - run: make check
      - run: make test-race
      - run: make test-tooling
      - run: make security
      # Both scopes stay blocking; provider-side revocation needs owner review.
      - run: make secrets
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Package Linux binary and notices
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: make package
      - name: Verify archive and native binary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "gopulse_${VERSION}_linux_${ARCH}.tar.gz.sha256"
          tar -xzf "gopulse_${VERSION}_linux_${ARCH}.tar.gz"
          if [ "$ARCH" = amd64 ]; then
            cd ..
            bash scripts/smoke-binary.sh "dist/gopulse_${VERSION}_linux_${ARCH}/gopulse" "$VERSION"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist
      - name: Verify downloaded checksums
        run: |
          cd dist
          sha256sum --check ./*.sha256
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          # An existing release causes failure; reruns never overwrite public assets.
          gh release create "$VERSION" dist/*.tar.gz dist/*.sha256 \
            --draft --target "$GITHUB_SHA" --title "GoPulse $VERSION" \
            --generate-notes --notes-file .github/RELEASE_NOTES.md "${args[@]}"
